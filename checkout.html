<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | HIRANYA</title>

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    margin:0;
    background:#faf7f2;
    font-family:Arial,Helvetica,sans-serif;
}

.checkout-section{
    padding:80px 20px;
}

.checkout-container{
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 420px;
    gap:40px;
}

.checkout-form,
.order-summary{

    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);

}

.checkout-form h2,
.order-summary h2{

    margin-bottom:25px;
    color:#b8860b;

}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

.input-group input,
.input-group textarea,
.input-group select{

    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;

}

textarea{
    resize:none;
}

.summary-row{

    display:flex;
    justify-content:space-between;
    margin:15px 0;
    font-size:18px;

}

.total{

    font-size:24px;
    color:#b8860b;
    font-weight:bold;

}

.place-btn{

    width:100%;
    margin-top:30px;
    padding:16px;
    background:#c99700;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;

}

.place-btn:hover{

    background:#a67c00;

}

@media(max-width:900px){

.checkout-container{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<section class="checkout-section">

<div class="checkout-container">

<div class="checkout-form">

<h2>Billing Details</h2>

<div class="input-group">
<label>Full Name</label>
<input type="text" id="name">
</div>

<div class="input-group">
<label>Email</label>
<input type="email" id="email">
</div>

<div class="input-group">
<label>Phone</label>
<input type="tel" id="phone">
</div>

<div class="input-group">
<label>Address</label>
<textarea rows="4" id="address"></textarea>
</div>

<div class="input-group">
<label>City</label>
<input type="text" id="city">
</div>

<div class="input-group">
<label>Pincode</label>
<input type="text" id="pincode">
</div>

<div class="input-group">
<label>Payment Method</label>

<select id="payment">


<option>UPI</option>
<option>Credit Card</option>
<option>Debit Card</option>
<option>Net Banking</option>

</select>

</div>

</div>

<div class="order-summary">

<h2>Order Summary</h2>

<div class="summary-row">

<span>Product</span>

<span id="productName">
Jewellery
</span>

</div>

<div class="summary-row">

<span>Price</span>

<span id="productPrice">
₹0
</span>

</div>

<hr>

<div class="summary-row total">

<span>Total</span>

<span id="totalPrice">
₹0
</span>

</div>

<button class="place-btn" onclick="placeOrder()">
Place Order
</button>

</div>

</div>

</section>

<script>

const product=JSON.parse(localStorage.getItem("selectedProduct"));

if(product){

document.getElementById("productName").innerHTML=product.name;

document.getElementById("productPrice").innerHTML="₹"+product.price.toLocaleString();

document.getElementById("totalPrice").innerHTML="₹"+product.price.toLocaleString();

}

function placeOrder(){

let name=document.getElementById("name").value;

let email=document.getElementById("email").value;

let phone=document.getElementById("phone").value;

let address=document.getElementById("address").value;

let city=document.getElementById("city").value;

let pincode=document.getElementById("pincode").value;

if(name==""||email==""||phone==""||address==""||city==""||pincode==""){

alert("Please fill all details.");

return;

}

window.location.href="success.html";

}

</script>

</body>

</html>
